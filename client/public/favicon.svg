<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Red circle border -->
  <circle cx="32" cy="32" r="31" fill="white" stroke="#C8102E" stroke-width="5"/>

  <!-- Pillar / column (center) -->
  <rect x="29.5" y="14" width="5" height="22" fill="#1a1a1a" rx="0.5"/>
  <!-- Pillar capital (top) -->
  <rect x="26" y="13" width="12" height="2.5" fill="#1a1a1a" rx="0.5"/>
  <!-- Pillar flute lines -->
  <line x1="31" y1="15" x2="31" y2="36" stroke="white" stroke-width="0.6"/>
  <line x1="33" y1="15" x2="33" y2="36" stroke="white" stroke-width="0.6"/>

  <!-- Scale beam (horizontal) -->
  <line x1="18" y1="22" x2="46" y2="22" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Center pivot point -->
  <circle cx="32" cy="22" r="1.5" fill="#1a1a1a"/>

  <!-- Left scale pan chain -->
  <line x1="20" y1="22" x2="20" y2="30" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left scale pan -->
  <path d="M14 30 Q20 35 26 30" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Right scale pan chain -->
  <line x1="44" y1="22" x2="44" y2="30" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right scale pan -->
  <path d="M38 30 Q44 35 50 30" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Base line of pillar -->
  <rect x="25" y="36" width="14" height="2" fill="#1a1a1a" rx="0.5"/>

  <!-- Laurel left -->
  <path d="M22 40 Q18 37 16 34 Q19 35 21 38 Q18 33 17 30 Q20 32 21 36 Q20 30 20 27 Q23 30 22 34 Q23 28 24 26 Q26 30 24 34" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linejoin="round"/>

  <!-- Laurel right -->
  <path d="M42 40 Q46 37 48 34 Q45 35 43 38 Q46 33 47 30 Q44 32 43 36 Q44 30 44 27 Q41 30 42 34 Q41 28 40 26 Q38 30 40 34" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linejoin="round"/>

  <!-- Small red scales icon at bottom center -->
  <line x1="29" y1="49" x2="35" y2="49" stroke="#C8102E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="51" stroke="#C8102E" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M27.5 49 Q29 51.5 30.5 49" stroke="#C8102E" stroke-width="1" fill="none"/>
  <path d="M33.5 49 Q35 51.5 36.5 49" stroke="#C8102E" stroke-width="1" fill="none"/>
</svg>
